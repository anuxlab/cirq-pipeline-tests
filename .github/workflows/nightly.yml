name: QML Nightly

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

jobs:
  extended:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pytest tests -m "slow or nightly" -v

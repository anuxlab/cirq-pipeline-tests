name: QML CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Verify environment
        run: |
          python --version
          python -m pip --version
          python -m pip check
          python -c "import cirq, numpy, scipy, sklearn, pytest; print('Cirq:', cirq.__version__); print('NumPy:', numpy.__version__); print('SciPy:', scipy.__version__); print('sklearn:', sklearn.__version__); print('pytest:', pytest.__version__)"
          python -c "import qml_ci; print('qml_ci:', qml_ci.__version__)"

      - name: Collect core tests
        run: |
          python -m pytest tests             -m "not slow and not nightly and not hardware"             --collect-only -q

      - name: Run core tests
        run: |
          python -m pytest tests             -m "not slow and not nightly and not hardware"             --cov=qml_ci             --cov-report=term-missing             --cov-report=xml             -v

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

name: QML CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install project and test dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Verify environment and imports
        run: |
          python --version
          python -m pip --version
          python -m pip show cirq pytest pytest-cov
          python -c "import cirq, numpy, scipy, sklearn, pytest; print('Cirq:', cirq.__version__); print('NumPy:', numpy.__version__); print('SciPy:', scipy.__version__); print('scikit-learn:', sklearn.__version__); print('pytest:', pytest.__version__)"
          python -c "import qml_ci, qml_ci.algorithms, qml_ci.encoding, qml_ci.mitigation, qml_ci.observables, qml_ci.resources, qml_ci.serialization, qml_ci.statistics, qml_ci.topology; print('qml_ci imports: OK')"

      - name: Collect tests
        run: |
          python -m pytest tests \
            -m "not slow and not nightly and not hardware" \
            --collect-only -q

      - name: Run core tests
        run: |
          python -m pytest tests \
            -m "not slow and not nightly and not hardware" \
            --cov=qml_ci \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

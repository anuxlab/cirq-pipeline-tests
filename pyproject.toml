[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qml-ci-complete"
version = "1.0.0"
description = "Comprehensive, simulator-first quantum machine learning CI/CD test framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cirq==1.7.0",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "pytest-benchmark>=5,<6",
]
hardware = [
  "qsimcirq>=0.23,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
  "slow: extended statistical or optimization tests",
  "hardware: optional real/specialized hardware tests",
  "nightly: extended regression tests",
]

[tool.coverage.run]
source = ["qml_ci"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]
